<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NamDPI | Xizmat ko‘rsatilayotgan chiptalar monitori</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- Video fon -->
<video autoplay muted loop id="bg-video">
    <source src="assets/video/web.webm" type="video/webm" />
</video>

<!-- HEADER -->
<header class="header glass">
    <div class="header-left">
        <img src="assets/img/logo.png" class="logo" alt="NamDPI Logo" />
        <div class="header-title">Xizmat ko‘rsatilayotgan navbatlar</div>
    </div>
    <div class="header-right">
        <div id="liveClock" class="live-clock">00:00:00</div>
        <div id="apiStatus" class="status-badge status-online">
            <span class="status-dot">●</span>
            <span id="apiStatusText">Bog‘langan</span>
        </div>
        <button id="settingsBtn" class="header-btn" title="Server sozlamalari">⚙️</button>
        <button id="themeToggle" class="header-btn" title="Mavzuni o‘zgartirish">🌙</button>
    </div>
</header>

<!-- MAIN CONTENT -->
<main class="main">
    <!-- CHAP PANEL: NAVBATLAR JADVALI -->
    <section class="left-panel glass">
        <table class="ticket-table">
            <thead>
            <tr>
                <th>Navbat raqami</th>
                <th>Oyna raqami</th>
            </tr>
            </thead>
            <tbody id="ticket-body">
                <!-- JS orqali to‘ldiriladi -->
            </tbody>
        </table>
    </section>

    <!-- O‘NG PANEL: VIDEO VA E'LON -->
    <div class="right-section">
        <div class="right-video glass">
            <video autoplay muted loop playsinline>
                <source src="assets/video/web.webm" type="video/webm" />
            </video>
            <!-- E’lon oynasi -->
            <div class="announcement" id="announcement">
                <div class="announcement-badge">🔔 Xizmatga taklif etiladi</div>
                <div class="announcement-ticket" id="announcement-ticket">----</div>
                <div class="announcement-window" id="announcement-window">-- - oyna</div>
            </div>
        </div>
        <!-- Promo ma'lumot -->
        <div class="promo-info glass">Namangan Davlat Pedagogika Instituti — Elektron Navbat Tizimi</div>
    </div>
</main>

<!-- FOOTER -->
<footer class="footer glass">
    © 2026 Namangan Davlat Pedagogika Instituti — Raqamli Ta'lim Texnologiyalari Markazi (RTTM)
</footer>

<!-- SOZLAMALAR MODALI -->
<div class="modal-backdrop" id="settingsModal">
    <div class="modal-content">
        <div class="modal-title">⚙️ Server Sozlamalari</div>
        <label for="apiUrlInput" style="display:block; margin-bottom: 8px; font-size: 13px; color: #cbd5e1;">API Server manzili (Serving tickets URL):</label>
        <input type="text" id="apiUrlInput" class="modal-input" placeholder="https://navbat.namspi.uz/api/tickets/serving/" />
        <div class="modal-actions">
            <button id="resetApiBtn" class="btn-secondary">Standart</button>
            <button id="cancelSettingsBtn" class="btn-secondary">Bekor qilish</button>
            <button id="saveSettingsBtn" class="btn-primary">Saqlash</button>
        </div>
    </div>
</div>

<!-- SCRIPT -->
<script src="script.js"></script>
<script src="renderer.js"></script>
</body>
</html>
